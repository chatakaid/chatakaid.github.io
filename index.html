<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chataka | Small Business Tools</title>
<meta name="description" content="Simple tools and systems for small business owners.">
<link rel="icon" href="logo.png">
<style>
  :root {
    --bg-page: #223854;     /* Background luar (hanya tampil di layar besar/web) */
    --bg-card: #0E2E56;     /* Background kotak utama / mobile */
    --ink: #ffffff; 
    --muted: #a0b4c8;
    --card-item: #ffffff;   /* Background putih untuk preview produk */
    --card-item-ink: #16261c;
    --line: #cbd8c8; 
    --accent: #4fc48a; 
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  
  /* Default untuk Mobile: Background luar disamakan atau dihilangkan agar menyatu */
  body {
    min-height: 100vh; 
    color: var(--ink); 
    background-color: var(--bg-card);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5; 
    padding: 0;
  }
  
  main { 
    width: 100%;
    max-width: 520px; 
    margin: 0 auto; 
    background-color: var(--bg-card);
    border-radius: 0;
    padding: 30px 20px 48px;
    box-shadow: none;
  }

  /* Khusus untuk tampilan Web / Desktop (Layar lebar > 600px) */
  @media (min-width: 600px) {
    body {
      background-color: var(--bg-page);
      padding: 40px 15px 50px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    main {
      border-radius: 36px;
      padding: 40px 24px 48px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }
  }

  header { text-align: center; margin-bottom: 28px; }
  .logo {
    width: 96px; height: 96px; border-radius: 50%; object-fit: cover;
    background: var(--card-item); border: 2px solid var(--line);
  }
  h1 { font-size: 1.5rem; margin: 14px 0 6px; letter-spacing: -0.01em; color: #ffffff; }
  .bio { color: #d0dbe5; margin: 0 auto; max-width: 42ch; }
  .socials { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 18px; }
  .socials a {
    display: flex; align-items: center; justify-content: center;
    width: 46px; height: 46px; 
    border: none; 
    border-radius: 50%;
    background: transparent;
    transition: transform 0.2s ease;
  }
  .socials a:hover { 
    background: transparent; 
    transform: scale(1.15);
  }
  .socials img { width: 32px; height: 32px; object-fit: contain; opacity: 1.0;}
  
  section { margin-top: 32px; }
  h2 { font-size: 1rem; margin: 0 0 14px; color: #ffffff; font-weight: 600; text-align: center; }
  
  .links { display: grid; gap: 10px; }
  
  /* Style umum untuk card */
  .link {
    display: flex; align-items: center; gap: 14px; padding: 16px;
    background: var(--card-item); color: var(--card-item-ink);
    border: none;
    border-radius: 20px; text-decoration: none; font-weight: 600;
    position: relative;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
  }
  
  /* Style khusus untuk large (gambar di atas) */
  .link.large { 
    flex-direction: column; 
    align-items: stretch; 
    gap: 16px; 
    padding: 20px 20px 24px;
  }
  
  /* Style khusus untuk small (thumbnail di kiri, teks di tengah) */
  .link.small {
    flex-direction: row;
    align-items: center;
  }

  .link img.thumb { 
    width: 64px; 
    height: 64px; 
    flex: none; 
    object-fit: cover; 
    border-radius: 12px; 
    border: 1px solid #e1e8ed;
  }
  
  .image-container {
    background: #ffffff;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    border: 1px solid #e1e8ed;
  }
  .link img.large { 
    width: 100%; 
    aspect-ratio: 16 / 9; 
    object-fit: cover; 
    display: block;
    border-radius: 0;
  }
  
  .card-footer-content {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 4px 4px 0 4px;
    text-align: center;
    width: 100%;
  }
  
  .card-text-wrapper {
    flex: 1;
    text-align: center;
  }

  .link small { display: block; margin-top: 2px; color: #55665b; font-weight: 400; }
  .link:hover { opacity: 0.95; }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  
  footer { text-align: center; margin-top: 40px; color: var(--muted); font-size: .8rem; }
</style>
</head>
<body>
<main>
  <header>
    <img id="logo" class="logo" alt="">
    <h1 id="brand"></h1>
    <p id="bio" class="bio"></p>
    <nav id="socials" class="socials" aria-label="Media sosial"></nav>
  </header>
  <div id="groups"></div>
  <footer id="footer"></footer>
</main>

<script>
const CONFIG = {
  gaId: "G-CL90WHPHN4",
  logo: "logo.png",
  brand: "Chataka | Small Business Tools",
  bio: "Simple tools and systems for small business owners. Spreadsheet templates to track your money, sales, and profit. Start with the free expense tracker ↓",
  footer: "© 2026 Chataka",
  socials: [
    { name: "YouTube",   url: "https://www.youtube.com/channel/UCITKTS_mizQmCQheYDcIK7g",  image: "img/youtube.png" },
    { name: "Instagram", url: "https://instagram.com/chataka.id", image: "img/instagram.png" },
    { name: "TikTok",    url: "https://tiktok.com/@chataka.id",   image: "img/tiktok.png" }
  ],
  groups: [
    {
      title: "Free Expense Tracker",
      links: [
        {
          title: "Free Expense Tracker for Small Business (Excel + Google Sheets)",
          url: "https://chatakaid.gumroad.com/l/expense-tracker",
          description: "",
          image: "img/expense-tracker.png",
          imageStyle: "large"
        },
      ]
    },
	{
      title: "Small Business Finance Apps",
      links: [
        {
          title: "Free POS & Bookkeeping App for Android",
          url: "https://play.google.com/store/apps/details?id=com.kopijawa101.temanumkm",
          description: "POS & bookkeeping for small businesses: inventory, debts, receivables & reports. Works offline. Free for Android.",
          image: "img/teman-umkm.png",
          imageStyle: "large"
        },
      ]
    }
  ]
};

window.dataLayer = window.dataLayer || [];
function gtag() { dataLayer.push(arguments); }
if (CONFIG.gaId) {
  const s = document.createElement("script");
  s.async = true;
  s.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(CONFIG.gaId);
  document.head.appendChild(s);
  gtag("js", new Date());
  gtag("config", CONFIG.gaId);
}

function track(name, url, group) {
  if (!CONFIG.gaId) return;
  gtag("event", "click_link", {
    link_name: name, link_url: url, link_group: group,
    transport_type: "beacon"
  });
}

function makeLink(cls, item, group) {
  const a = document.createElement("a");
  a.className = cls;
  a.href = item.url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.addEventListener("click", () => track(item.name || item.title, item.url, group));
  return a;
}

const logo = document.getElementById("logo");
logo.src = CONFIG.logo;
logo.alt = CONFIG.brand;
document.getElementById("brand").textContent = CONFIG.brand;
document.getElementById("bio").textContent = CONFIG.bio;
document.getElementById("footer").textContent = CONFIG.footer;

const socials = document.getElementById("socials");
CONFIG.socials.forEach(item => {
  const a = makeLink("", item, "social");
  a.setAttribute("aria-label", item.name);
  a.title = item.name;
  const img = document.createElement("img");
  img.src = item.image;
  img.alt = item.name;
  a.appendChild(img);
  socials.appendChild(a);
});

const groups = document.getElementById("groups");
CONFIG.groups.forEach(group => {
  const sec = document.createElement("section");
  const h = document.createElement("h2");
  h.textContent = group.title;
  const list = document.createElement("div");
  list.className = "links";
  group.links.forEach(item => {
    const isLarge = item.image && item.imageStyle === "large";
    const isSmall = item.image && item.imageStyle === "small";
    
    let linkClass = "link";
    if (isLarge) linkClass += " large";
    if (isSmall) linkClass += " small";

    const a = makeLink(linkClass, item, group.title);
    
    if (item.image) {
      if (isLarge) {
        const imgContainer = document.createElement("div");
        imgContainer.className = "image-container";
        
        const img = document.createElement("img");
        img.className = "large";
        img.src = item.image;
        img.alt = "";
        img.loading = "lazy";
        img.onerror = () => imgContainer.remove();
        
        imgContainer.appendChild(img);
        a.appendChild(imgContainer);
      } else if (isSmall) {
        const img = document.createElement("img");
        img.className = "thumb";
        img.src = item.image;
        img.alt = "";
        img.loading = "lazy";
        img.onerror = () => img.remove();
        a.appendChild(img);
      } else {
        const img = document.createElement("img");
        img.className = "thumb";
        img.src = item.image;
        img.alt = "";
        img.loading = "lazy";
        img.onerror = () => img.remove();
        a.appendChild(img);
      }
    }
    
    if (isLarge || isSmall) {
      const footerContent = document.createElement("div");
      footerContent.className = "card-footer-content";

      const textWrapper = document.createElement("div");
      textWrapper.className = "card-text-wrapper";

      const text = document.createElement("span");
      text.textContent = item.title;
      if (item.description) {
        const d = document.createElement("small");
        d.textContent = item.description;
        text.appendChild(d);
      }
      textWrapper.appendChild(text);
      footerContent.appendChild(textWrapper);
      
      a.appendChild(footerContent);
    } else {
      const text = document.createElement("span");
      text.textContent = item.title;
      if (item.description) {
        const d = document.createElement("small");
        d.textContent = item.description;
        text.appendChild(d);
      }
      a.appendChild(text);
    }

    list.appendChild(a);
  });
  sec.append(h, list);
  groups.appendChild(sec);
});
</script>
</body>
</html>
